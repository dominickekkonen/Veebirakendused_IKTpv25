<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iseseisev tabel</title>
  <link rel="stylesheet" href="tabelstyle.css">
</head>
<body>
<h1>Iseseisev tabel</h1>
<h2>Tuleb luua HTML tabeli nagu joonistatud õpetaja poolt antud paberil</h2>
<table id="iseseisevtabel">
  <tr>
    <td colspan="10" class="nimi10">10</td>
  </tr>
  <tr>
    <td rowspan="5" class="nimi9">9</td>
    <td colspan="5" class="nimi6">6</td>
    <td rowspan="4" class="nimi7">7</td>
  </tr>
  <tr>
    <td rowspan="2" class="nimi5">5</td>
    <td rowspan="2" class="nimi1">1</td>
    <td class="nimiplus1">+</td>
    <td rowspan="2" colspan="2" class="nimi2">2</td>
  </tr>
  <tr>
    <td class="nimiplus2">+</td>
  </tr>
  <tr>
    <td class="nimi4">4</td>
    <td colspan="4" class="nimi3">3</td>
  </tr>
  <tr>
    <td colspan="6" class="nimi8">8</td>
  </tr>
</table>
</body>
</html>
