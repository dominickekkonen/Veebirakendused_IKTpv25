<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
  <link rel="stylesheet" href="tabelstyle.css">
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id="lihtne">
  <tr>
    <td class="nimiA">A</td>
    <td class="nimiB">B</td>
  </tr>
  <tr>
    <td class="nimiC">C</td>
    <td class="nimiD">D</td>
  </tr>
</table>
<h2>Tabel kus on ühendanud lahtrid</h2>
<table id="keeruline1">
  <tr>
    <td colspan="2" class="nimiA">A</td>
  </tr>
  <tr>
    <td class="nimiC">C</td>
    <td class="nimiD">D</td>
  </tr>
</table>
<h2>Teine tabel kus on ühendanud lahtrid</h2>
<table id="keeruline2">
  <tr>
    <td rowspan="2" class="nimiA">A</td>
    <td class="nimiB">B</td>
  </tr>
  <tr>
    <td class="nimiD">D</td>
  </tr>
</table>
<h2>Iseseisev tabel</h2>
<table id="iseseisev">
  <tr>
    <td rowspan="4" class="nimiA">A</td>
    <td colspan="4" class="nimiB">B</td>
  </tr>
  <tr>
    <td class="nimiD">C</td>
    <td class="nimiD">D</td>
    <td class="nimiD" colspan="2" rowspan="3">E</td>
  </tr>
  <tr>
    <td colspan="2" class="nimiD">F</td>
  </tr>
  <tr>
    <td colspan="2" class="nimiD">G</td>
  </tr>
</table>
</body>
</html>
