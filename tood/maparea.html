<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map area</title>
    <link rel="stylesheet" href="mapareaStyle.css">
</head>
<body>
<h1>Map area kasutamine</h1>
<h2>Tuleb klikkida päeva ilma</h2>
<img src="arvutipilt.jpg" alt="arvuti pilt" usemap="#arvuti">
<map name="arvuti">
  <!--circle cords x y R-->
  <area shape="circle" coords="535,520,50" href="https://arvutitark.ee/arvutid-ja-lisad/sulearvutid/notebookasusvivobook-seriess14" alt="ilm" target="_blank">
  <!--rect cords x y x1 y2-->
  <area shape="poly" coords="763,312,813,318,782,415,738,400" href="ilm.html" alt="ilm">
  <area shape="poly" coords="811,163,1046,169,767,303,999,332" href="linn.html" alt="linn">
  <!--poly cords tuleb võta kõik koordinatid vasakult panema-->
  <area shape="poly" coords="5,15,570,15,440,430,5,440" href="https://www.finnair.com/ee-et/sihtkohad/euroopa/holland/amsterdam" alt="arvuti">
</map>
<div>Palun kliki pildi peal</div>
</body>
</html>
