<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalkulaatorid</title>
    <link rel="stylesheet" href="kalkStyle.css">
    <script src="../js/kalk1Script.js"></script>
    <script src="../js/kalk2Script.js"></script>
</head>
<body>
<h1>Kalkulatorid</h1>
<section id="yld">
    <!-- css paigus flex row -->
    <section id="kalkulator1">
        <h2>Meetri/Tolli kalkulaator</h2>
        <label for="arv">Sisesta arv</label>
        <input type="number" id="arv" min="1" max="100" step="1" onchange="teisendamine()">
        <br>
        <input type="radio" name="valik" id="meeter" value="meeter" onchange="teisendamine()">
        <label for="meeter">Meeter</label>
        <br>
        <input type="radio" name="valik" id="tolli" value="tolli" onchange="teisendamine()">
        <label for="tolli">Toll</label>
        <br>
        <div id="vastus"></div>
        <img src="" alt="" id="vastusePilt">
    </section>
    <section id="kalkulator2">
        <h2>Joogi kalkulaator</h2>
        <label for="kogus">Mitu tk sovid</label>
        <input type="number" id="kogus" min="1" max="100" value="1">
        <label for="joogiValik">Vali lemmikjook:</label>
        <select name="joogiValik" id="joogiValik" onchange="jookideValik()">
            <option value="vali">vali..</option>
            <option value="kohv">Kohv</option>
            <option value="vesi">Vesi</option>
            <option value="cola">Coca-Cola</option>
            <option value="fanta">Fanta</option>
        </select>
        <div id="vastus2"></div>
    </section>
    <section id="kalkulator3">
        <h2>Moodle Ül 2</h2>
        <label for="km">Läbitud vahemaa</label>
        <input type="number" id="km" min="0" step="any">
        <br>
        <label for="liitrid">Kütusekulu</label>
        <input type="number" id="liitrid" min="0" step="any">
        <br>
        <label for="hind">Kütuse hind</label>
        <input type="number" id="hind" min="0" step="any">
        <br>
        <input type="button" value="Arvuta" onclick="arvutaKytuseKulu()">
        <div id="vastus3"></div>
    </section>
</section>
</body>
</html>
