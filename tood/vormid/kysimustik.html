<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
<!-- c + tab komentaar -->
<!-- Tekstkast -->
    <label for="nimi">Nimi:</label>
    <input type="text" id="nimi" placeholder="nimi" />
    <br>
    <!-- ripploend või rippmenüü -->
    <label for="stiil">Vali meeldivaim muusikastiil:</label>
    <br>
    <select name="stiil" id="stiil">
        <option value="metall">metall</option>
        <option value="jazz">jazz</option>
        <option value="räpp">räpp</option>
        <option value="elektronik">elektronik</option>
    </select>
    <br>
    <!-- raadio nupp -üks valik mitmest -->
    <strong>
        Kuidas sa muussikat peamiselt kuulad?
    </strong>
    <br>
    <input type="radio" name="platform" id="Spotify">
    <label for="Spotify">Spotify</label>
    <br>
    <input type="radio" name="platform" id="Vinüülplaat">
    <label for="Vinüülplaat">Vinüülplaat</label>
    <br>
    <input type="radio" name="platform" id="raadio">
    <label for="raadio">Raadio</label>
    <br>
    <!-- checkbox -->
    <fieldset>
        <legend>Tee oma valikud - lemmik ansambel</legend>
        <input type="checkbox" name="lemmikud" id="beatles">
        <label for="beatles">Beatles</label>
        <br>
        <input type="checkbox" name="lemmikud" id="vaults">
        <label for="vaults">Vaults</label>
        <br>
        <input type="checkbox" name="lemmikud" id="megadeth">
        <label for="megadeth">Megadeth</label>
        <br>
        <input type="checkbox" name="lemmikud" id="Deftones">
        <label for="Deftones">Deftones</label>
    </fieldset>
</form>
</body>
</html>
