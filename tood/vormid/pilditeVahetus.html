<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../js/piltScript.js"></script>
</head>
<body onload="juhuslikPilt()">
<h1>Juhuslik pilt</h1>
<img src="../images/lill.png" alt="" id="randomPilt">
<input type="button" onclick="juhuslikPilt()" value="Vaheta pilt">
<section id="mystatus">
    <h2>Mõistatus. Arva ära mida näed pildil</h2>
    <label for="valik">Tee oma valik:</label>
    <select name="vailk" id="valik" onchange="selectValik()">
        <option value="vali...">vali</option>
        <option value="../images/smile.png">Smile</option>
        <option value="../images/neutral.png">Neutral</option>
        <option value="../images/kurb.png">Kurb</option>
        <option value="../images/lill.png">Lill</option>
    </select>
    <div id="vastus">Siia tuleb vastus</div>
</section>
<section id="valik2">
    <h2>Pildi kuvamiseks tee oma valiku</h2>
    <input type="radio" name="piltValik" id="v1" value="../images/smile.png" onclick="radioValik()">
    <label for="v1">Smile pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v2" value="../images/neutral.png" onclick="radioValik()">
    <label for="v2">Neutralne pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v3" value="../images/kurb.png" onclick="radioValik()">
    <label for="v3">Kurb pilt</label>
    <br>
    <img src="" alt="" id="valitudPilt">
</section>
</body>
</html>
